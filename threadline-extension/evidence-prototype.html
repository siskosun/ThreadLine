<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>研线 · 证据采纳原型（S0a）</title>
  <style>
    body{font:15px/1.6 system-ui,sans-serif;margin:0;background:#f2f5f9;color:#1e2b3a}
    main{max-width:960px;margin:0 auto;padding:24px}
    .surface{background:#fff;border:1px solid #d7e0ea;border-radius:10px;padding:16px 18px;margin-bottom:16px}
    h1{font-size:21px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
    .subtle{color:#5b6b7c;font-size:13px}
    textarea{width:100%;min-height:64px;font:14px/1.5 ui-monospace,Consolas,monospace;
      border:1px solid #cbd6e4;border-radius:8px;padding:10px;box-sizing:border-box}
    button{background:#215e9b;border:0;color:#fff;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
    button.secondary{background:#eaf0f7;color:#25384f}
    button[disabled]{opacity:.4;cursor:not-allowed}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
    .frag{border-left:3px solid #215e9b;padding:6px 10px;margin:8px 0;background:#f7fafd}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .item{border-top:1px solid #e3eaf1;padding:10px 0}
    #ev-notice{margin:8px 0;min-height:20px;font-size:14px}
    #ev-notice[data-error="true"]{color:#a4262c}
    .timing{font-size:13px;color:#41586e}
    table{border-collapse:collapse;width:100%;font-size:13px}
    td,th{border-bottom:1px solid #e3eaf1;text-align:left;padding:4px 6px}
  </style>
</head>
<body>
<main>
  <h1>研线 · 证据采纳原型（S0a）</h1>
  <p class="subtle">计划 §十一 S0a 原型：单事务权威写入（service worker 唯一写者）、依据片段、只读摘要投影与采纳计时。本页为原型验证通道，不接入原有课题库。</p>

  <section class="surface" aria-label="采纳">
    <h2>采纳一条结论</h2>
    <div class="row">
      <label>课题 <select id="ev-project"></select></label>
      <label><input type="checkbox" id="ev-fixture-mode" checked> 载入固定样例（计时协议）</label>
      <button class="secondary" id="ev-load-fixture" type="button">载入样例</button>
    </div>
    <label>结论正文（≤4000 code points）<textarea id="ev-text" placeholder="要采纳的重要结论"></textarea></label>
    <label>适用条件（可选）<textarea id="ev-conditions" rows="2" placeholder="仅在…条件下适用"></textarea></label>
    <h2 style="margin-top:12px">依据片段（1–8 条）</h2>
    <div id="ev-fragments"></div>
    <div class="row">
      <button class="secondary" id="ev-add-fragment" type="button">＋ 添加片段</button>
      <button id="ev-adopt" type="button">采纳并保存（单事务）</button>
    </div>
    <div id="ev-notice"></div>
  </section>

  <section class="surface" aria-label="已采纳结论">
    <h2>已采纳结论与依据 <button class="secondary" id="ev-refresh" type="button">刷新</button></h2>
    <div id="ev-list"></div>
    <h2 style="margin-top:14px">只读摘要投影（旧 decision 形态）</h2>
    <pre id="ev-summary" class="mono subtle" style="white-space:pre-wrap"></pre>
  </section>

  <section class="surface" aria-label="计时与探针">
    <h2>计时协议（12 次有效操作）</h2>
    <div class="row">
      <button id="ev-run-protocol" type="button">自动执行 12 次计时协议</button>
      <button class="secondary" id="ev-copy-timings" type="button">复制计时 JSON</button>
    </div>
    <div id="ev-timing-table"><table><thead><tr><th>#</th><th>类型</th><th>耗时 ms</th><th>结果</th></tr></thead><tbody></tbody></table></div>
    <h2 style="margin-top:12px">存储探针</h2>
    <pre id="ev-quota" class="mono subtle" style="white-space:pre-wrap"></pre>
  </section>
</main>
<script src="evidence-prototype.js"></script>
</body>
</html>
