name: ThreadLine Windows baseline
on:
  pull_request:
    paths:
      - 'threadline-extension/**'
      - '.github/workflows/windows-baseline.yml'
      - 'scripts/check-plan.mjs'
      - 'docs/PLAN.md'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-baseline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node and browser environment
        working-directory: threadline-extension
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
      - name: Node regression from unrelated current directory
        working-directory: threadline-extension
        shell: pwsh
        run: |
          npm run verify 2>&1 | Tee-Object -FilePath windows-node.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          node "$env:GITHUB_WORKSPACE/threadline-extension/scripts/check-syntax.mjs" 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/threadline-extension/windows-cwd.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Playwright Chromium
        working-directory: threadline-extension
        shell: pwsh
        run: |
          python -m pip install playwright==1.60.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synthetic Chromium MV3 test on Windows
        working-directory: threadline-extension
        shell: pwsh
        run: |
          npm run test:e2e 2>&1 | Tee-Object -FilePath windows-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact Windows test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            threadline-extension/windows-node.log
            threadline-extension/windows-cwd.log
            threadline-extension/windows-e2e.log
