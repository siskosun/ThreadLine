name: ThreadLine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX hook scripts
        run: sh -n .githooks/pre-push scripts/install-pre-push.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node syntax, version, plan and regression tests
        working-directory: threadline-extension
        run: |
          set -o pipefail
          npm run verify | tee ../plan-node-test.log
      - name: Check regression test-count floor
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          data = Path('plan-node-test.log').read_text(encoding='utf-8', errors='replace')
          counts = [int(n) for n in re.findall(r'(?m)^# tests (\d+)\s*      - name: Install Chromium for true MV3 extension integration (synthetic ChatGPT page only)
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Persistent extension integration
        working-directory: threadline-extension
        run: npm run test:e2e

  publish:
    name: Publish tested release archive
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned install ZIP and SHA256
        run: python scripts/build-release.py
      - name: Verify checksum before publishing
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Publish immutable GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("threadline-extension/manifest.json", encoding="utf-8"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: not replacing previously published assets"
          else
            gh release create "$TAG" "dist/ThreadLine-${TAG}.zip" "dist/SHA256SUMS.txt" \
              --title "ThreadLine ${TAG}" \
              --notes "Validated ThreadLine ${TAG} installer. The MV3 test uses a synthetic ChatGPT page; real authenticated ChatGPT flows still require manual acceptance testing."
          fi
, data)]
          if not counts or counts[-1] < 94:
              raise SystemExit(f'Regression test count below original baseline 94: {counts}')
          print(f'Node regression cases: {counts[-1]} (baseline floor: 94)')
          PY
      - name: Validate plan evidence against GitHub PRs and checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-plan.mjs --github
      - name: Install Chromium for true MV3 extension integration (synthetic ChatGPT page only)
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Persistent extension integration
        working-directory: threadline-extension
        run: npm run test:e2e

  publish:
    name: Publish tested release archive
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned install ZIP and SHA256
        run: python scripts/build-release.py
      - name: Verify checksum before publishing
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Publish immutable GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("threadline-extension/manifest.json", encoding="utf-8"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: not replacing previously published assets"
          else
            gh release create "$TAG" "dist/ThreadLine-${TAG}.zip" "dist/SHA256SUMS.txt" \
              --title "ThreadLine ${TAG}" \
              --notes "Validated ThreadLine ${TAG} installer. The MV3 test uses a synthetic ChatGPT page; real authenticated ChatGPT flows still require manual acceptance testing."
          fi
