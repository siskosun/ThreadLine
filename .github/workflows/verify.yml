name: ThreadLine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node syntax, version and regression tests
        working-directory: threadline-extension
        run: npm run verify
      - name: Install Chromium for true MV3 extension integration (synthetic ChatGPT page only)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Persistent extension integration
        working-directory: threadline-extension
        run: npm run test:e2e
