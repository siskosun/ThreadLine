name: Capture paired extension source for UI comparison

on:
  push:
    branches:
      - chore/ui-before-after-snapshot-20261027

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout approved before main snapshot
        uses: actions/checkout@v4
        with:
          ref: 52f44779a00890e3e06f762d989f93765a872bec
          path: before
      - name: Checkout approved after UI-D1 snapshot
        uses: actions/checkout@v4
        with:
          ref: 98a314ef2455685932d03b9b54b37152ff0a15d5
          path: after
      - name: Package both exact extension snapshots
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          dest=Path("threadline-comparison-source-pair.zip")
          with zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED) as archive:
              for stage in ["before","after"]:
                  base=Path(stage)/"threadline-extension"
                  assert (base/"manifest.json").is_file(),stage
                  for f in sorted(base.rglob("*")):
                      if f.is_file() and not any(p in ("node_modules",".git","__pycache__") for p in f.parts):
                          archive.write(f,Path(stage)/f.relative_to(base))
          print(dest, dest.stat().st_size)
          PY
      - name: Upload exact immutable source pair
        uses: actions/upload-artifact@v4
        with:
          name: threadline-ui-comparison-source-pair
          path: threadline-comparison-source-pair.zip
          retention-days: 3
      - name: Checkout screenshot harness (isolated branch)
        uses: actions/checkout@v4
        with:
          ref: chore/ui-before-after-snapshot-20261027
          path: harness
      - name: Setup Playwright and Chinese fonts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Render before (main) at 360 CSS px
        run: python harness/scripts/capture-ui-visual-comparison.py --stage before --extension before/threadline-extension --out compare-images
      - name: Render after (PR 78) at 360 and 1280 CSS px
        run: python harness/scripts/capture-ui-visual-comparison.py --stage after --extension after/threadline-extension --out compare-images
      - name: Upload true Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threadline-ui-real-screenshots
          path: compare-images/*.png
          if-no-files-found: warn
          retention-days: 3
